[project]
name = "teamtrau-autoedit"
version = "0.1.0"
description = "Production-Grade Automated Video Editing Toolkit Orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opentimelineio>=0.16.0",
    "opentimelineio-plugins>=0.18.1",
    "scenedetect[opencv]>=0.6.4",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "auto-editor>=24.0.0",
    "pydantic>=2.7.0",
    "click>=8.1.7",
    "numpy>=1.24.0",
    "opencv-python>=4.9.0",
    "ffmpeg-python>=0.2.0",
    "ultralytics>=8.0.0",
    "faster-whisper>=1.0.0",
    "openai>=1.0.0",
    "mcp>=2.0.0",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
    "pyside6>=6.7.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
sidecar = [
    "pyinstaller>=6.22.3",
]

# NVIDIA GPUs: take torch/torchvision CUDA 12.6 builds on Windows and Linux (PyPI ships
# CPU-only Windows wheels). cu126 bundles cuBLAS 12 / cuDNN 9, which faster-whisper's
# ctranslate2 also loads once torch is imported. macOS keeps the PyPI build (MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: runs real ffmpeg/ffprobe binaries (skipped when unavailable)"]
